name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.x'
          # MiniRPKI has no external Go modules, so it has no go.sum to cache.
          cache: false
      - run: test -z "$(gofmt -d $(find cmd internal -name '*.go' -type f))"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./cmd/mini-rpki

  container-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t mini-rpki:ci .
      - run: docker build --build-arg BASE_IMAGE=mini-rpki:ci -t mini-rpki-clab:ci lab/containerlab/cache
