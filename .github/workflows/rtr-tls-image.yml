name: Publish experimental RTR TLS image

on:
  push:
    branches:
      - feature/rtr-tls

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/mini-rpki

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the experimental image
        run: |
          docker build -t "$IMAGE:rtr-tls" .
          docker push "$IMAGE:rtr-tls"
