frr defaults traditional
hostname router
log stdout
interface eth1
 ip address 10.82.0.2/30
exit
interface eth2
 ip address 10.82.1.1/30
 ipv6 address 2001:db8:82:1::1/64
exit
rpki
 rpki polling_period 5
 rpki retry_interval 10
 rpki cache tcp 10.82.0.1 8282 source 10.82.0.2 preference 1
exit
router bgp 65000
 bgp router-id 198.51.100.1
 no bgp ebgp-requires-policy
 neighbor 10.82.1.2 remote-as 65001
 address-family ipv4 unicast
  neighbor 10.82.1.2 soft-reconfiguration inbound
 exit-address-family
 address-family ipv6 unicast
  neighbor 10.82.1.2 activate
  neighbor 10.82.1.2 soft-reconfiguration inbound
 exit-address-family
