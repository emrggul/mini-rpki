frr defaults traditional
hostname router
log stdout
rpki
 rpki polling_period 5
 rpki retry_interval 10
 rpki cache tcp 172.30.82.2 8282 preference 1
exit
router bgp 65000
 bgp router-id 198.51.100.1
 no bgp ebgp-requires-policy
 neighbor 172.30.82.4 remote-as 65001
 address-family ipv4 unicast
  neighbor 172.30.82.4 soft-reconfiguration inbound
 exit-address-family
 address-family ipv6 unicast
  neighbor 172.30.82.4 activate
  neighbor 172.30.82.4 soft-reconfiguration inbound
 exit-address-family
